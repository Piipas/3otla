name: Contributions

# Contributions from the website arrive as issues labelled `contribution`.
# Maintainers moderate them with a label:
#   accepted → a confirmation becomes a data pull request; other kinds get a to-do comment
#   rejected → the issue is closed as "not planned"
# Only people with triage access can add labels, so only maintainers can trigger this.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: contribution-${{ github.event.issue.number }}

jobs:
  accept:
    if: github.event.label.name == 'accepted' && contains(github.event.issue.labels.*.name, 'contribution')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: apply
        # The issue body is untrusted: pass it through the environment, never inline.
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/apply-contribution.ts
      - if: steps.apply.outputs.applied == 'true'
        run: pnpm --filter @3otla/data test && pnpm --filter @3otla/core test
      - if: steps.apply.outputs.applied == 'true'
        env:
          SUMMARY: ${{ steps.apply.outputs.summary }}
        run: |
          branch="contribution/$ISSUE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add packages/data/confirmations.json
          git commit -m "Confirm $SUMMARY (#$ISSUE)"
          git push --force origin "$branch"
          url=$(gh pr create --head "$branch" --title "Confirm $SUMMARY" \
            --body "Adds the official confirmation from #$ISSUE. Data tests passed in the workflow. Closes #$ISSUE")
          gh issue comment "$ISSUE" --body "Accepted ✅ Pull request: $url"
      - if: steps.apply.outputs.applied != 'true' && success()
        run: |
          gh issue comment "$ISSUE" --body "Accepted ✅ This kind of contribution needs a manual change to the data. A maintainer will open a pull request that references this issue."
      - if: failure()
        run: |
          gh issue comment "$ISSUE" --body "Could not apply this contribution automatically. See the workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  reject:
    if: github.event.label.name == 'rejected' && contains(github.event.issue.labels.*.name, 'contribution')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          gh issue close "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --reason "not planned" \
            --comment "Thank you for the contribution. It was not accepted: dates must come from an official source (maroc.ma, *.gov.ma, MAP) and match what was officially announced. Feel free to send a new one."
